<style>
:root{--ground:#F7F1E4;--panel:#FFFDF8;--ink:#2A2420;--ink-soft:#7A6F60;--hair:#E6D9BE;
  --blue:#3E5C80;--terra:#AE6240;--sauge:#7C8768;--ocre:#C9973F;--rose:#C98B8B;
  --accent:#AE6240;--accent-soft:rgba(174,98,64,.12)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--ground);color:var(--ink);font-family:'Hanken Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
/* ---- cachet de cire — placeholder typo, à remplacer par le vrai C/L tracés ---- */
.seal{width:62px;height:62px;border-radius:50%;border:1.5px solid var(--ink);position:relative;display:grid;place-items:center;background:var(--panel);flex-shrink:0;transform-origin:center}
.seal::before{content:"";position:absolute;inset:6px;border-radius:50%;border:1px solid var(--terra);opacity:.45}
.seal .cap{font-family:'Fraunces',serif;font-weight:500;font-size:25px;color:var(--ink);line-height:1;position:relative;top:-1px}
.seal .amp-l{position:absolute;bottom:8px;right:9px;font-family:'Fraunces',serif;font-style:italic;font-weight:400;font-size:11px;color:var(--terra);line-height:1}
.seal.sm{width:52px;height:52px}.seal.sm .cap{font-size:20px}.seal.sm .amp-l{font-size:9.5px;bottom:6px;right:7px}
.seal.stamp{animation:stamp .5s cubic-bezier(.3,0,.2,1)}
@keyframes stamp{0%{transform:scale(1) rotate(0)}35%{transform:scale(.84) rotate(-4deg)}60%{transform:scale(1.05) rotate(1.5deg)}100%{transform:scale(1) rotate(0)}}
.eyebrow{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:var(--ink-soft)}
.duo{display:flex;width:42px;height:2px;margin:11px 0 8px}.duo .b{flex:1;background:var(--blue)}.duo .t{flex:1;background:var(--terra)}
/* ---- brindille florale (originale, sobre) ---- */
.sprig{width:64px;height:auto;margin:2px auto;display:block;color:var(--sauge)}
/* ---- talon de ticket perforé ---- */
.tear{width:100%;height:14px;margin:2px 0 2px;background-image:radial-gradient(circle at 9px 7px,var(--ground) 4px,transparent 4.5px);background-size:18px 14px;background-position:-3px 0;opacity:.9}
/* ---------- JEU ---------- */
#game{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:18px;padding:26px 22px calc(env(safe-area-inset-bottom) + 28px)}
.brand{display:flex;flex-direction:column;align-items:center;gap:9px;margin-top:4px}
#game main{flex:1;width:100%;max-width:430px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.deck{width:100%;perspective:1500px}
.card{position:relative;background:var(--panel);border:1px solid var(--hair);border-radius:22px;padding:30px 28px 32px;box-shadow:0 36px 70px -42px rgba(34,38,44,.5);display:flex;flex-direction:column;align-items:center;text-align:center}
.card.flip{animation:flip .55s cubic-bezier(.4,0,.2,1)}
@keyframes flip{0%{transform:rotateY(0)}45%{transform:rotateY(86deg);opacity:.1}55%{transform:rotateY(-86deg);opacity:.1}100%{transform:rotateY(0);opacity:1}}
.card .top{width:100%;display:flex;align-items:center;justify-content:space-between;padding-bottom:15px;border-bottom:1px solid var(--hair)}
.card .num{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-soft)}
.card .chip{width:14px;height:14px;border-radius:50%;background:var(--accent);transition:background .45s}
.card .emoji{font-size:34px;margin:26px 0 16px;line-height:1;width:74px;height:74px;display:grid;place-items:center;border-radius:50%;background:var(--accent-soft);transition:background .45s}
.card .txt{font-family:'Fraunces',serif;font-weight:380;font-size:26px;line-height:1.22;letter-spacing:-.006em;max-width:320px}
.card .rule{width:38px;height:3px;background:var(--accent);margin-top:24px;border-radius:3px;transition:background .45s}
.pv-card{width:100%;background:var(--panel);border:1px solid var(--hair);border-radius:22px;padding:14px;box-shadow:0 36px 70px -44px rgba(34,38,44,.5)}
.pv-img{width:100%;max-height:46vh;object-fit:contain;border-radius:14px;display:block;background:var(--ground)}
.pv-defi{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.04em;color:var(--ink-soft);text-align:center;margin:12px 6px 6px;line-height:1.4}
.mark{width:64px;height:64px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:30px}
.big{font-family:'Fraunces',serif;font-weight:400;font-size:26px;line-height:1.2}
.subt{font-family:'Hanken Grotesk';font-size:14px;color:var(--ink-soft);max-width:280px;line-height:1.5}
.tally{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--terra)}
.card .pad{display:flex;flex-direction:column;align-items:center;gap:13px;padding:8px 0}
.actions{width:100%;display:flex;flex-direction:column;align-items:center;gap:12px}
.go{width:100%;background:var(--ink);color:var(--ground);border:none;border-radius:14px;padding:17px;font-family:'DM Mono',monospace;font-weight:500;font-size:13.5px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:transform .12s,opacity .2s}
.go:active{transform:scale(.98)}.go:hover{opacity:.92}.go:disabled{opacity:.55;cursor:default}
.ghost{width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--hair);border-radius:14px;padding:16px;font-family:'DM Mono',monospace;font-weight:500;font-size:13px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.change{display:flex;align-items:center;gap:8px;background:none;border:none;color:var(--ink-soft);cursor:pointer;font-family:'DM Mono',monospace;font-size:12.5px;letter-spacing:.06em;padding:6px 4px}
.change svg{width:15px;height:15px}
.nochange{font-family:'DM Mono',monospace;font-size:11.5px;letter-spacing:.04em;color:var(--terra)}
.gallink{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.04em;text-decoration:underline;text-underline-offset:4px;padding:2px;opacity:.85}
.status{font-family:'DM Mono',monospace;font-size:11.5px;letter-spacing:.05em;color:var(--accent);min-height:15px}
input[type=file]{display:none}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:99}.flash.go2{animation:fl .4s ease}
@keyframes fl{0%{opacity:0}10%{opacity:.7}100%{opacity:0}}
.notice{display:none;background:var(--panel);border:1px solid var(--terra);border-radius:12px;padding:13px 16px;font-size:12.5px;line-height:1.5;max-width:360px;text-align:center}
.notice code{font-family:'DM Mono',monospace;color:var(--blue)}
/* ---------- ALBUM ---------- */
#album{min-height:100dvh;display:flex;flex-direction:column;padding:0 18px calc(env(safe-area-inset-bottom) + 40px)}
.al-head{display:flex;flex-direction:column;align-items:center;text-align:center;padding:26px 0 14px}
.al-wm{font-family:'Fraunces',serif;font-weight:380;font-size:26px;letter-spacing:-.01em;margin-top:10px}.al-wm em{font-style:italic;color:var(--terra)}
.al-count{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);margin-top:8px}
.al-btns{display:flex;gap:9px;margin-top:14px}
.al-btn{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border-radius:10px;padding:11px 16px;border:1px solid var(--hair);background:var(--panel);color:var(--ink)}
.al-btn.primary{background:var(--ink);color:var(--ground);border-color:var(--ink);font-weight:500}
.al-btn:disabled{opacity:.45;cursor:default}
.al-viewer{flex:1;display:flex;flex-direction:column;align-items:center;max-width:760px;width:100%;margin:0 auto;gap:14px}
.al-stage{position:relative;width:100%;display:flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--hair);border-radius:16px;overflow:hidden;min-height:240px}
.al-stage img{max-width:100%;max-height:56vh;display:block;object-fit:contain;transition:opacity .25s}
.al-nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:none;background:rgba(248,244,236,.92);color:var(--ink);font-size:20px;cursor:pointer;box-shadow:0 4px 14px rgba(34,38,44,.18)}
.al-nav.prev{left:12px}.al-nav.next{right:12px}
.al-cap{width:100%;text-align:center}
.al-idx{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.16em;color:var(--ink-soft)}.al-idx b{color:var(--blue)}
.al-defi{font-family:'Fraunces',serif;font-weight:400;font-size:22px;line-height:1.25;margin:7px auto 0;max-width:520px}
.al-guest{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--terra);margin-top:6px}
.al-dl{margin-top:14px;display:inline-flex;align-items:center;gap:8px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--terra);border:1px solid var(--terra);border-radius:10px;padding:10px 16px;text-decoration:none;cursor:pointer}
.al-rail{width:100%;max-width:760px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;padding:6px 2px 10px}
.al-t{flex:0 0 auto;width:62px;height:62px;border-radius:9px;overflow:hidden;cursor:pointer;border:2px solid transparent;opacity:.7}
.al-t.active{border-color:var(--blue);opacity:1}.al-t img{width:100%;height:100%;object-fit:cover}
.al-state{text-align:center;color:var(--ink-soft);max-width:430px;margin:50px auto;line-height:1.6;font-size:15px}
.al-state h2{font-family:'Fraunces',serif;font-weight:400;color:var(--ink);font-size:1.5rem;margin-bottom:10px}
.al-state code{font-family:'DM Mono',monospace;color:var(--blue);font-size:13px}
.al-toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--ground);font-family:'DM Mono',monospace;font-size:12px;padding:11px 18px;border-radius:999px;z-index:60;display:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
  <div class="flash" id="flash"></div>

  <!-- ====== JEU (invités) ====== -->
  <div id="game">
    <div class="brand"><div class="seal" id="brandSeal"><span class="cap">C</span><span class="amp-l">&amp;L</span></div><div class="eyebrow">Le jeu photo</div></div>
    <main>
      <section id="sc-defi" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:20px">
        <div class="deck"><div class="card" id="card">
          <div class="top"><span class="num" id="num">Défi</span><span class="chip" id="chip"></span></div>
          <div class="emoji" id="emoji">🎲</div><div class="txt" id="txt">…</div><div class="rule" id="rule"></div>
        </div></div>
        <div class="tear"></div>
        <div class="actions">
          <button class="go" id="shoot">Réaliser ce défi</button>
          <button class="change" id="reroll"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg><span class="lbl">Changer de défi</span></button>
          <div class="nochange" id="nochange" hidden>Allez, celui-là est pour toi 😄</div>
          <button class="gallink" id="pick">depuis ma galerie</button>
          <div class="notice" id="notice">⚙️ Page à configurer.</div>
        </div>
      </section>
      <section id="sc-preview" hidden style="width:100%;display:flex;flex-direction:column;align-items:center;gap:18px">
        <div class="pv-card"><img class="pv-img" id="pv-img" alt=""><div class="pv-defi" id="pv-defi"></div></div>
        <div class="actions"><button class="go" id="confirm">Confirmer l'envoi</button><button class="ghost" id="retake">Reprendre la photo</button><div class="status" id="status"></div></div>
      </section>
      <section id="sc-again" hidden style="width:100%;display:flex;flex-direction:column;align-items:center;gap:20px">
        <div class="card"><div class="pad"><div class="mark">✓</div><div class="big">Défi relevé !</div><div class="subt">Votre photo est dans l'album de Candice &amp; Louis. On en relève un autre ?</div><div class="tally" id="tally"></div></div></div>
        <div class="actions"><button class="go" id="yes">Oui, un autre défi</button><button class="ghost" id="no">Non, j'ai terminé</button></div>
      </section>
      <section id="sc-thanks" hidden style="width:100%;display:flex;flex-direction:column;align-items:center;gap:20px">
        <div class="card"><div class="pad"><div class="seal sm"><span class="cap">C</span><span class="amp-l">&amp;L</span></div>
          <svg class="sprig" viewBox="0 0 64 60" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" style="color:var(--sauge);width:52px">
            <path d="M4 6 C22 6 34 16 60 12"/>
            <circle cx="14" cy="7" r="2.4" fill="var(--terra)" stroke="none"/>
            <circle cx="30" cy="11" r="2.2" fill="var(--rose)" stroke="none"/>
            <circle cx="46" cy="10" r="2.2" fill="var(--ocre)" stroke="none"/>
          </svg>
          <div class="big">Merci d'avoir joué&nbsp;!</div><div class="subt" id="thanksmsg"></div><div class="tally" id="tally2"></div></div></div>
        <div class="actions"><button class="go" id="replay">Relever un nouveau défi</button></div>
      </section>
    </main>
    <input type="file" id="cam" accept="image/*" capture="environment">
    <input type="file" id="gal" accept="image/*">
  </div>

  <!-- ====== ALBUM (mariés) — accessible via /#album ====== -->
  <div id="album" hidden>
    <div class="al-head">
      <div class="seal"><span class="cap">C</span><span class="amp-l">&amp;L</span></div>
      <svg class="sprig" viewBox="0 0 64 90" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
        <path d="M32 88 C30 62 34 40 30 18"/>
        <path d="M30 18 C24 14 18 15 13 10"/><circle cx="11" cy="8" r="2.6" fill="var(--terra)" stroke="none"/>

        <path d="M31 42 C25 38 20 39 15 35"/><circle cx="13" cy="33" r="2.2" fill="var(--ocre)" stroke="none"/>
        <path d="M31 42 C37 37 42 38 48 33"/><circle cx="50" cy="31" r="2.2" fill="var(--terra)" stroke="none"/>
        <path d="M31 62 C26 59 22 60 18 57"/><circle cx="16" cy="56" r="2" fill="var(--rose)" stroke="none"/>
      </svg>
      <div class="al-wm">Candice <em>&amp;</em> Louis</div>
      <div class="duo"><div class="b"></div><div class="t"></div></div>
      <div class="al-count" id="al-count">Chargement…</div>
      <div class="al-btns"><button class="al-btn primary" id="al-dlall" disabled>Télécharger l'album</button><button class="al-btn" id="al-refresh">Actualiser</button></div>
    </div>
    <div class="al-viewer" id="al-viewer" hidden>
      <div class="al-stage" id="al-stage"><button class="al-nav prev" id="al-prev" aria-label="Précédent">‹</button><img id="al-big" alt=""><button class="al-nav next" id="al-next" aria-label="Suivant">›</button></div>
      <div class="al-cap"><div class="al-idx" id="al-idx"></div><div class="al-defi" id="al-defi"></div><div class="al-guest" id="al-guest"></div><a class="al-dl" id="al-dlone" download>⬇ Télécharger cette photo</a></div>
      <div class="al-rail" id="al-rail"></div>
    </div>
    <div class="al-state" id="al-state" hidden></div>
    <div class="al-toast" id="al-toast"></div>
  </div>

const $=s=>document.querySelector(s);
const configured=CONFIG.cloudName&&CONFIG.cloudName!=="TON_CLOUD_NAME"&&CONFIG.uploadPreset&&CONFIG.uploadPreset!=="TON_PRESET";
/* ---------- JEU ---------- */
const flash=$('#flash');let current=null,drawn=0,changesLeft=MAX_CHANGES,doneCount=0,pendingFile=null,inflight=0;
if(!configured)$('#notice').style.display='block';
try{doneCount=parseInt(localStorage.getItem('cl_done')||'0')||0;}catch(e){}
function screen(n){['defi','preview','again','thanks'].forEach(function(s){$('#sc-'+s).hidden=(s!==n);});}
function softRGBA(h,a){return 'rgba('+parseInt(h.slice(1,3),16)+','+parseInt(h.slice(3,5),16)+','+parseInt(h.slice(5,7),16)+','+a+')';}
function applyAccent(h){const r=document.documentElement.style;r.setProperty('--accent',h);r.setProperty('--accent-soft',softRGBA(h,0.12));}
function stampSeal(){const s=$('#brandSeal');if(!s)return;s.classList.remove('stamp');void s.offsetWidth;s.classList.add('stamp');}
function drawDefi(){drawn++;const p=DEFIS[Math.floor(Math.random()*DEFIS.length)];current=p[1];applyAccent(BRAND[(drawn-1)%BRAND.length]);stampSeal();
  const c=$('#card');c.classList.remove('flip');void c.offsetWidth;c.classList.add('flip');
  setTimeout(function(){$('#num').textContent='Défi Nº '+String(drawn).padStart(2,'0');$('#emoji').textContent=p[0];$('#txt').textContent=p[1];},250);}
function updateChange(){const b=$('#reroll'),lbl=b.querySelector('.lbl');if(changesLeft>0){b.hidden=false;$('#nochange').hidden=true;lbl.textContent='Changer de défi · '+changesLeft+' restant'+(changesLeft>1?'s':'');}else{b.hidden=true;$('#nochange').hidden=false;}}
function newRound(){changesLeft=MAX_CHANGES;updateChange();drawDefi();$('#status').textContent='';screen('defi');}
$('#reroll').addEventListener('click',function(){if(changesLeft>0){changesLeft--;drawDefi();updateChange();}});
$('#shoot').addEventListener('click',function(){$('#cam').click();});
$('#pick').addEventListener('click',function(){$('#gal').click();});
$('#cam').addEventListener('change',function(e){if(e.target.files[0]){doFlash();preview(e.target.files[0]);}e.target.value='';});
$('#gal').addEventListener('change',function(e){if(e.target.files[0])preview(e.target.files[0]);e.target.value='';});
function doFlash(){flash.classList.remove('go2');void flash.offsetWidth;flash.classList.add('go2');}
function preview(file){pendingFile=file;$('#pv-img').src=URL.createObjectURL(file);$('#pv-defi').textContent='« '+current+' »';$('#status').textContent='';$('#confirm').disabled=false;screen('preview');}
$('#retake').addEventListener('click',function(){$('#cam').click();});
$('#confirm').addEventListener('click',function(){if(pendingFile)upload(pendingFile,current);});
function upload(file,defi){if(!configured){$('#status').textContent='Page non configurée';return;}
  inflight++;$('#confirm').disabled=true;$('#status').textContent='Envoi…';
  var ctx=[];if(defi)ctx.push('defi='+defi.replace(/[=|]/g,' '));
  var fd=new FormData();fd.append('file',file);fd.append('upload_preset',CONFIG.uploadPreset);fd.append('tags',CONFIG.eventTag);if(ctx.length)fd.append('context',ctx.join('|'));
  var xhr=new XMLHttpRequest();xhr.open('POST','https://api.cloudinary.com/v1_1/'+CONFIG.cloudName+'/image/upload');
  xhr.upload.onprogress=function(e){if(e.lengthComputable)$('#status').textContent='Envoi… '+Math.round(e.loaded/e.total*100)+'%';};
  xhr.onload=function(){inflight--;if(xhr.status>=200&&xhr.status<300){doneCount++;try{localStorage.setItem('cl_done',doneCount);}catch(e){}$('#tally').textContent='🏆 '+doneCount+' défi'+(doneCount>1?'s':'')+' relevé'+(doneCount>1?'s':'');screen('again');}else{$('#confirm').disabled=false;$('#status').textContent='Échec — réessayer';}};
  xhr.onerror=function(){inflight--;$('#confirm').disabled=false;$('#status').textContent='Échec — réessayer';};
  xhr.send(fd);}
$('#yes').addEventListener('click',newRound);
$('#no').addEventListener('click',function(){$('#thanksmsg').innerHTML='Vous avez fait vivre la soirée avec <b>'+doneCount+'</b> photo'+(doneCount>1?'s':'')+'. Tout est déjà dans l\'album des mariés. 🥂';$('#tally2').textContent='À très vite sur la piste !';screen('thanks');});
$('#replay').addEventListener('click',newRound);
/* ---------- ALBUM ---------- */
let alPhotos=[],alCur=0,alInited=false;
const alBase='https://res.cloudinary.com/'+CONFIG.cloudName+'/image';
function alThumb(p){return alBase+'/upload/c_fill,g_auto,w_140,h_140,q_auto,f_auto/v'+p.version+'/'+p.public_id+'.'+p.format;}
function alView(p){return alBase+'/upload/c_limit,w_1400,q_auto,f_auto/v'+p.version+'/'+p.public_id+'.'+p.format;}
function alFull(p){return alBase+'/upload/q_auto/v'+p.version+'/'+p.public_id+'.'+p.format;}
function alCtx(p){var c=(p.context&&(p.context.custom||p.context))||{};return{defi:(c.defi||'').trim(),guest:(c.guest||'').trim()};}
function alSlug(s){return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,42)||'photo';}
function alName(p,i){var c=alCtx(p);return String(i+1).padStart(3,'0')+'_'+alSlug(c.defi)+(c.guest?'_'+alSlug(c.guest):'')+'.'+p.format;}
function alState(t,h){$('#al-viewer').hidden=true;$('#al-state').hidden=false;$('#al-state').innerHTML='<h2>'+t+'</h2>'+h;}
async function alLoad(){if(!configured){alState('Album à configurer','La configuration arrive bientôt.');return;}
  $('#al-count').textContent='Chargement…';
  try{var r=await fetch(alBase+'/list/'+CONFIG.eventTag+'.json',{cache:'no-store'});if(!r.ok)throw 0;
    var d=await r.json();alPhotos=(d.resources||[]).sort(function(a,b){return (b.created_at||'').localeCompare(a.created_at||'');});alRender();}
  catch(e){alState('Album pas encore accessible','Soit aucune photo n\'a encore été envoyée, soit l\'option <code>Resource list</code> n\'est pas activée dans Cloudinary (Settings → Security).');$('#al-count').textContent='—';}}
function alRender(){if(!alPhotos.length){alState('Album vide pour l\'instant','Dès que les invités relèvent des défis, les photos apparaissent ici — chacune avec son défi.');$('#al-count').textContent='0 photo';$('#al-dlall').disabled=true;return;}
  $('#al-state').hidden=true;$('#al-viewer').hidden=false;$('#al-count').textContent=alPhotos.length+' photo'+(alPhotos.length>1?'s':'');$('#al-dlall').disabled=false;
  var rail=$('#al-rail');rail.innerHTML='';
  alPhotos.forEach(function(p,i){var t=document.createElement('div');t.className='al-t'+(i===alCur?' active':'');var im=new Image();im.loading='lazy';im.src=alThumb(p);t.appendChild(im);t.onclick=function(){alShow(i);};rail.appendChild(t);});
  alShow(alCur);}
function alShow(i){alCur=(i+alPhotos.length)%alPhotos.length;var p=alPhotos[alCur];var c=alCtx(p);
  var big=$('#al-big');big.style.opacity=0;big.onload=function(){big.style.opacity=1;};big.src=alView(p);
  $('#al-idx').innerHTML='<b>'+String(alCur+1).padStart(2,'0')+'</b> / '+alPhotos.length;
  $('#al-defi').textContent=c.defi||'—';$('#al-guest').textContent=c.guest?('par '+c.guest):'';
  var d=$('#al-dlone');d.href=alFull(p);d.download=alName(p,alCur);
  document.querySelectorAll('#al-rail .al-t').forEach(function(el,idx){el.classList.toggle('active',idx===alCur);});
  var act=document.querySelector('#al-rail .al-t.active');if(act)act.scrollIntoView({inline:'center',block:'nearest'});}
$('#al-prev').onclick=function(){alShow(alCur-1);};$('#al-next').onclick=function(){alShow(alCur+1);};$('#al-refresh').onclick=alLoad;
var alsx=0;var alstage=$('#al-stage');
alstage.addEventListener('touchstart',function(e){alsx=e.touches[0].clientX;},{passive:true});
alstage.addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-alsx;if(Math.abs(dx)>45)alShow(alCur+(dx<0?1:-1));},{passive:true});
document.addEventListener('keydown',function(e){if(!$('#album').hidden){if(e.key==='ArrowLeft')alShow(alCur-1);if(e.key==='ArrowRight')alShow(alCur+1);}});
$('#al-dlall').onclick=async function(){var b=$('#al-dlall');b.disabled=true;var zip=new JSZip();var ok=0;
  for(var i=0;i<alPhotos.length;i++){alToast('Préparation… '+(i+1)+'/'+alPhotos.length);try{var blob=await(await fetch(alFull(alPhotos[i]))).blob();zip.file(alName(alPhotos[i],i),blob);ok++;}catch(e){}}
  if(!ok){alToast('Échec du téléchargement');b.disabled=false;return;}alToast('Compression du zip…');
  var out=await zip.generateAsync({type:'blob'});var a=document.createElement('a');a.href=URL.createObjectURL(out);a.download='Album_Candice_Louis.zip';a.click();URL.revokeObjectURL(a.href);
  alToast(ok+' photos téléchargées');setTimeout(function(){$('#al-toast').style.display='none';},2500);b.disabled=false;};
function alToast(m){var t=$('#al-toast');t.textContent=m;t.style.display='block';}
/* ---------- ROUTAGE ---------- */
function route(){var h=(location.hash||'').toLowerCase();var isAlbum=h.indexOf('album')>=0||h.indexOf('galerie')>=0;
  $('#game').hidden=isAlbum;$('#album').hidden=!isAlbum;if(isAlbum&&!alInited){alInited=true;alLoad();}}
window.addEventListener('hashchange',route);
route();newRound();
</script>
